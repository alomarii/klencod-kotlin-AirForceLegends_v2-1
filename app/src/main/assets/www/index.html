<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Air Force Legends</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,Tahoma,Arial,sans-serif;touch-action:none;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:none}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;direction:ltr;text-shadow:0 1px 3px #000;font-weight:700}
.top small{display:block;font-weight:400;opacity:.8;font-size:11px}
.bar{height:9px;width:130px;background:#0008;border:1px solid #fff5;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e33,#fd3,#3e5)}
#boss{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:20%;right:20%;display:none}
#boss .bar{width:100%;height:10px}#boss .bar i{background:linear-gradient(90deg,#a0f,#f33)}
#msg{position:absolute;top:32%;width:100%;text-align:center;font-size:30px;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px #f90,0 2px 4px #000;opacity:0;transition:opacity .4s}
.act{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:12px;pointer-events:auto}
.act button{width:66px;height:66px;font-size:28px;position:relative}
.act b{position:absolute;bottom:-2px;right:-2px;background:#f90;color:#000;border-radius:10px;padding:1px 6px;font-size:13px}
#a1{right:14px}#a2{left:14px}
button{background:linear-gradient(#2b3a52,#141c2b);color:#fff;border:2px solid #6e8fb8;border-radius:40px;padding:12px 22px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px #0008;font-family:inherit}
button:active{transform:scale(.94)}button.pri{background:linear-gradient(#ffb02e,#e0620d);border-color:#ffd27a}
button:disabled{opacity:.45}
.p{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(#0b1730cc,#000d);text-align:center;padding:16px;overflow:auto}
.p.on{display:flex}
h1{margin:0;font-size:38px;font-weight:900;background:linear-gradient(#fff,#8fc2ff);-webkit-background-clip:text;color:transparent;letter-spacing:1px;filter:drop-shadow(0 3px 8px #0af8)}
h2{margin:0}
.sub{opacity:.75;font-size:13px}
.menu{display:flex;flex-direction:column;gap:10px;min-width:220px}
.st{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;width:240px;font-size:13px;direction:ltr;text-align:left}
.st .bar{width:100%;margin:0}.st .bar i{background:#4cf}
select{background:#141c2b;color:#fff;border:2px solid #6e8fb8;border-radius:12px;padding:10px;font-size:16px}
#pv{width:220px;height:180px}
.row{display:flex;gap:10px;align-items:center}
.cr{font-size:12px;opacity:.9;margin-top:6px;line-height:1.7}
.cr b{color:#ffcf5a}
#lGrid{display:grid;grid-template-columns:repeat(4,76px);gap:10px;direction:ltr}
.lv{padding:8px 0;border-radius:16px;font-size:22px;display:flex;flex-direction:column;align-items:center}
.lv b{font-size:16px}.lv small{font-size:12px;color:#fc3}.lv i{font-size:9px;color:#f66;font-style:normal}
.p{backdrop-filter:blur(6px)}h2{text-shadow:0 0 14px #4af}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="top">
  <div><span id="sc" style="font-size:22px">0</span><small id="cmb"></small><div class="bar"><i id="hp"></i></div><div class="bar" style="height:5px"><i id="shb" style="background:#4cf;width:0"></i></div></div>
  <div style="text-align:center"><span id="lv"></span><small id="co"></small></div>
  <div style="pointer-events:auto"><button onclick="pause()" style="padding:6px 14px;font-size:18px">❚❚</button></div>
 </div>
 <div id="boss"><div class="bar"><i id="bh"></i></div></div>
 <div id="msg"></div>
 <div class="act" id="a1"><button id="bM" onclick="fireMissile()">🚀<b id="nM">0</b></button></div>
 <div class="act" id="a2"><button id="bB" onclick="bomb()">💣<b id="nB">0</b></button></div>
</div>

<div class="p on" id="pMenu">
 <h1>AIR FORCE LEGENDS</h1><div class="sub" data-i="tip"></div>
 <div class="menu">
  <button class="pri" onclick="openLevels()" data-i="play"></button>
  <button onclick="openLoad()" data-i="load"></button>
  <button onclick="openHangar()" data-i="hangar"></button>
  <button onclick="show('pSet')" data-i="settings"></button>
 </div>
 <div class="sub">★ <span id="mBest"></span> &nbsp; 🪙 <span id="mCoin"></span></div>
 <div class="cr"><span data-i="dev"></span>: <b>محمد العمري / Mohammed Al-Omari</b><br>📞 <b>730215825</b></div>
</div>

<div class="p" id="pHangar">
 <h2 data-i="hangar"></h2><div class="sub">🪙 <span id="hCoin"></span></div>
 <div class="row"><button onclick="hg(-1)">◀</button><canvas id="pv" style="position:static;width:220px;height:180px"></canvas><button onclick="hg(1)">▶</button></div>
 <h2 id="hName" style="direction:ltr"></h2><div class="sub" id="hAb"></div>
 <div class="st" id="hSt"></div>
 <div class="row"><button class="pri" id="hBtn" onclick="hAct()"></button><button id="hUp" onclick="hUpg()"></button><button onclick="show('pMenu')" data-i="menu"></button></div>
</div>

<div class="p" id="pSet">
 <h2 data-i="settings"></h2>
 <div><div class="sub" data-i="lang"></div><select id="selL" onchange="setLang(this.value)"></select></div>
 <button id="bSnd" onclick="toggleSnd()"></button>
 <button onclick="show('pMenu')" data-i="menu"></button>
</div>

<div class="p" id="pPause"><h2 data-i="paused"></h2>
 <button class="pri" onclick="resume()" data-i="resume"></button>
 <button onclick="startGame()" data-i="restart"></button>
 <button onclick="toMenu()" data-i="menu"></button></div>

<div class="p" id="pOver"><h1 data-i="over"></h1>
 <div style="font-size:22px"><span data-i="score"></span>: <b id="oS"></b></div>
 <div class="sub"><span data-i="best"></span>: <span id="oB"></span> &nbsp; 🪙 +<span id="oC"></span></div>
 <button class="pri" onclick="startGame()" data-i="restart"></button>
 <button onclick="openHangar()" data-i="hangar"></button>
 <button onclick="toMenu()" data-i="menu"></button></div>

<div class="p" id="pLv"><h2 data-i="camp"></h2><div class="sub">🪙 <span id="lCoin"></span></div><div id="lGrid"></div><button onclick="show('pMenu')" data-i="menu"></button></div>

 <button class="pri" id="rN" onclick="startGame(lvl+1)" data-i="next"></button><button onclick="startGame(lvl)" data-i="retry"></button><button onclick="openLevels()" data-i="camp"></button></div>

function tone(f,d,ty='square',v=.05,sl=0){if(!save.snd)return;const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f,a.currentTime);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(master);o.start();o.stop(a.currentTime+d)}

 P.hp-=d;P.inv=.6;shake=12;sfx.hit();vib(60);if(src.vx!==undefined)src.x2=1;boom(P.x,P.y-10,.5,0);P.wl=Math.max(0,P.wl-(Math.random()<.3?1:0));
 if(P.hp<=0){boom(P.x,P.y,3);state='over';end()}}
function win(){state='win';const r=P.hp/P.mhp,st=1+(r>.35)+(r>.7);save.stars[lvl-1]=Math.max(save.stars[lvl-1]||0,st);const g=Math.floor(sc/150)+coinsRun+10+st*8;save.coins+=g;save.best=Math.max(save.best,sc);persist();
 $('rT').textContent=t('win');$('rS').textContent='★'.repeat(st)+'☆'.repeat(3-st);$('rC').textContent='🪙 +'+g+'   '+t('score')+': '+sc;$('rN').style.display=lvl<LVLS?'':'none';$('hud').style.display='none';show('pRes')}
function end(){const gain=Math.floor(sc/150)+coinsRun;save.coins+=gain;if(sc>save.best)save.best=sc;persist();setTimeout(()=>{$('oS').textContent=sc;$('oB').textContent=save.best;$('oC').textContent=gain;$('hud').style.display='none';show('pOver')},1400)}

/* ===== Enemy AI ===== */
function ai(e,dt){const sk=cl(.3+lvl*.07,.3,1),T=ET[e.type]||{sp:50};
 // dodge player bullets (fighters / interceptors): smarter at higher levels
 const dodge=()=>{let best=null,bd=1e9;for(const b of pb){const dy=e.y-b.y;if(dy>0&&dy<170*S&&Math.abs(b.x-e.x)<e.r*1.6&&dy<bd){bd=dy;best=b}}if(best&&Math.random()<sk+.2)e.vx+=(e.x>=best.x?1:-1)*500*S*dt*sk};
 switch(e.type){
 case'turret':case'sam':case'tank':case'boat':{e.y+=bgSpeed*dt;e.x+=(e.vx||0)*dt;e.ang=Math.atan2(P.y-e.y,P.x-e.x);
  if(e.fc<=0&&e.y>0&&e.y<H*.75){if(e.type=='sam'){eb.push({x:e.x,y:e.y,vx:0,vy:-60*S,h:1,life:3.5});sfx.mis();e.fc=R(3,4.5)}else{const b=e.type=='boat';eshoot(e,b?200:230,b?.12:0,b?2:1);e.fc=R(1.2,2.4)}}break}
 case'drone':e.y+=T.sp*S*dt;e.x=(e.ox!==undefined?e.baseX||(e.baseX=e.x):e.x)+Math.sin(e.t*2)*50*S;e.vy=0;if(lvl>2&&e.fc<=0){eshoot(e,200,0,1);e.fc=R(2,4)}break;
 case'fighter':{const ty=H*(.14+(e.id*3%.2));if(e.y<ty)e.y+=T.sp*1.3*S*dt;else e.y+=Math.sin(e.t)*10*S*dt;
  dodge();e.vx*=.92;const want=P.x+(e.ox||0)*.5;e.x+=((want-e.x)*.6*sk+e.vx)*dt+Math.sin(e.t*1.7)*15*S*dt;
  if(e.fc<=0&&e.y>0){e.burst=(e.burst||0)+1;eshoot(e,260,.08,lvl>5?3:lvl>2?2:1);e.fc=e.burst%3?.18:R(1.4,2.6)-lvl*.05}
  if(e.t>16)e.y+=200*S*dt;break}
 case'inter':if(!e.lock){e.y+=T.sp*.8*S*dt;e.x+=(P.x-e.x)*1.6*dt;if(e.y>H*.18||e.t>1.6)e.lock=1}else{e.y+=T.sp*2.6*S*dt;e.x+=(P.x-e.x)*(.3+sk)*dt*(e.y<P.y-60*S?1:0)}break;
 case'heli':{const ty=H*.2;if(e.y<ty)e.y+=T.sp*S*dt;else{e.x+=Math.sign(P.x-e.x)*Math.min(Math.abs(P.x-e.x),90*S)*dt}
  if(e.fc<=0&&e.y>0){eshoot(e,230,.28,3+(lvl>6?2:0));e.fc=Math.max(.9,2.2-lvl*.08)}if(e.t>18)e.y+=120*S*dt;break}
 case'bomber':e.y+=T.sp*S*dt;e.x+=Math.sin(e.t*.7)*25*S*dt;if(e.fc<=0&&e.y>0){eshoot(e,200,.35,5,0);e.fc=Math.max(1,2.3-lvl*.06)}break;
 case'boss':{const hp=e.hp/e.mhp;if(e.y<H*.17)e.y+=60*S*dt;else{e.x=W/2+Math.sin(e.t*.6)*(W*.32);
   if(e.fc<=0){const ph=hp>.66?0:hp>.33?1:2;
    if(ph==0){eshoot(e,250,.2,5,1);e.fc=1.1}
    else if(ph==1){e.sp2=(e.sp2||0)+1;for(let i=0;i<8;i++){const a=i/8*6.28+e.sp2*.3;eb.push({x:e.x,y:e.y,vx:Math.cos(a)*190*S,vy:Math.sin(a)*190*S})}eshoot(e,280,0,1);e.fc=.55}
    else{for(let i=0;i<14;i++){const a=i/14*6.28+e.t;eb.push({x:e.x,y:e.y,vx:Math.cos(a)*200*S,vy:Math.sin(a)*200*S})}eshoot(e,300,.14,3);if(Math.random()<.3&&en.length<8)mk('drone',e.x,e.y);e.fc=.7}}}break}
 }}

/* ===== Render ===== */
function shadow(x,y,fn){cx.save();cx.globalAlpha=.28;cx.translate(x+22*S,y+34*S);fn(true);cx.restore()}
function render(dt){
 cx.save();if(shake>0)cx.translate(R(-shake,shake)*.5,R(-shake,shake)*.5);
 drawBG(dt,bgSpeed);
 if(state!=='menu'&&P){
  for(const i of it)drawItem(i);
  for(const e of en)drawEnemy(e);
  for(const m of ms){cx.save();cx.translate(m.x,m.y);cx.rotate(m.a+Math.PI/2);cx.fillStyle='#ddd';cx.fillRect(-2.5*S,-8*S,5*S,16*S);cx.fillStyle='#f33';cx.fillRect(-2.5*S,-8*S,5*S,4*S);cx.fillStyle='#777';cx.fillRect(-5*S,4*S,10*S,2*S);cx.fillStyle='#fb3';cx.beginPath();cx.ellipse(0,10*S,2*S,R(4,8)*S,0,0,7);cx.fill();cx.restore()}
  cx.globalCompositeOperation='lighter';
  for(const b of pb){const g=cx.createLinearGradient(b.x,b.y,b.x-b.vx*.03,b.y-b.vy*.03);g.addColorStop(0,b.c||'#ff8');g.addColorStop(1,'#0000');cx.strokeStyle=g;cx.lineWidth=3.2*(b.w||1)*S;cx.beginPath();cx.moveTo(b.x,b.y);cx.lineTo(b.x-b.vx*.035,b.y-b.vy*.035);cx.stroke()}
  for(const b of eb){cx.fillStyle='#f62';cx.beginPath();cx.arc(b.x,b.y,(b.h?8:5)*S,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(b.x,b.y,2.2*S,0,7);cx.fill()}
  cx.globalCompositeOperation='source-over';
  if(state!=='over'||P.hp>0){const flick=P.inv>0&&Math.floor(tm*20)%2;if(!flick)drawPlayer(P.x,P.y,P.bank,tm)}
  cx.globalCompositeOperation='lighter';
  for(const p of pt){const a=p.l/p.m;if(p.k==2){cx.globalCompositeOperation='source-over';cx.fillStyle=`rgba(60,60,60,${a*.35})`;cx.beginPath();cx.arc(p.x,p.y,p.s*(2-a),0,7);cx.fill();cx.globalCompositeOperation='lighter'}else if(p.k==3){cx.fillStyle=`rgba(210,240,255,${a})`;cx.beginPath();cx.arc(p.x,p.y,p.s*.8,0,7);cx.fill()}else if(p.k==1){cx.fillStyle=`rgba(255,230,120,${a})`;cx.fillRect(p.x,p.y,p.s,p.s)}else{cx.fillStyle=`rgba(255,${Math.floor(60+170*a)},20,${a})`;cx.beginPath();cx.arc(p.x,p.y,p.s*(.6+a*.6),0,7);cx.fill()}}
  for(const r of rings){const a=1-r.r/r.mx;cx.strokeStyle=r.big||r.w?`rgba(160,225,255,${a})`:`rgba(255,200,120,${a})`;cx.lineWidth=(r.big?10:3)*S;cx.beginPath();cx.arc(r.x,r.y,r.r,0,7);cx.stroke()}
  cx.globalCompositeOperation='source-over'}
 else{const t2=performance.now()/1000;drawPlayer(W/2+Math.sin(t2)*30,H*.72+Math.cos(t2*1.3)*10,Math.cos(t2)*.5,t2)}
 drawClouds(dt,bgSpeed);cx.restore();
 cx.fillStyle='#0003';cx.fillRect(0,0,W,H*0);
 const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.8);vg.addColorStop(0,'#0000');vg.addColorStop(1,'#0007');cx.fillStyle=vg;cx.fillRect(0,0,W,H)}
function drawPlayer(x,y,bank,t){const j=JETS[save.sel];const f=sh=>{cx.save();cx.translate(x,y);cx.scale(S*1.4,S*1.4);if(sh){cx.fillStyle='#000';cx.globalAlpha=1}if(j.heli)drawHeli(cx,j.col,t*40,1);else drawJet(cx,j,sh?['#000','#000']:j.col,!sh,bank);cx.restore()};
 shadow(x,y,f);f(false);
 if(state==='play'&&P.sh>0){cx.strokeStyle=`rgba(80,200,255,${.4+.3*Math.sin(tm*12)})`;cx.lineWidth=3*S;cx.fillStyle='rgba(80,200,255,.12)';cx.beginPath();cx.arc(x,y,36*S,0,7);cx.fill();cx.stroke()}}
function drawGround(e){if(e.y<-60)return;const r=e.r,T=e.type,k=e.fl>0,bar=c=>cx.fillStyle=k?'#fff':c;cx.save();cx.translate(e.x,e.y);
 cx.fillStyle='#0004';cx.beginPath();cx.ellipse(r*.25,r*.3,r*1.1,r*(T=='boat'?1.7:1.1),0,0,7);cx.fill();
 if(T=='boat'){cx.fillStyle='#fff4';cx.beginPath();cx.moveTo(-r*.5,-r*1.2);cx.lineTo(-r*1.5,-r*3.6);cx.lineTo(r*1.5,-r*3.6);cx.lineTo(r*.5,-r*1.2);cx.fill();
  bar('#6b7480');cx.beginPath();cx.moveTo(0,r*1.7);cx.lineTo(r*.8,r*.4);cx.lineTo(r*.7,-r*1.2);cx.lineTo(-r*.7,-r*1.2);cx.lineTo(-r*.8,r*.4);cx.closePath();cx.fill();bar('#4a525c');cx.fillRect(-r*.45,-r*.9,r*.9,r*.9)}
 else if(T=='tank'){bar('#2f3a26');cx.fillRect(-r*.9,-r,r*.35,r*2);cx.fillRect(r*.55,-r,r*.35,r*2);bar('#5b6a45');cx.fillRect(-r*.6,-r*.9,r*1.2,r*1.8)}
 else if(T=='turret'){bar('#8a7f66');cx.beginPath();cx.arc(0,0,r,0,7);cx.fill();bar('#555');cx.beginPath();cx.arc(0,0,r*.55,0,7);cx.fill()}
 else{bar('#4a5240');cx.fillRect(-r,-r*.8,r*2,r*1.6);for(const d of[-1,1]){cx.save();cx.translate(d*r*.4,0);cx.rotate(-.2*d);bar('#ddd');cx.fillRect(-2.5,-r*1.1,5,r*1.6);bar('#e33');cx.fillRect(-2.5,-r*1.1,5,5);cx.restore()}}
 if(T!='sam'){cx.save();cx.translate(0,T=='boat'?r*.5:0);cx.rotate((e.ang||0)-Math.PI/2);bar('#222');if(T=='turret'){cx.fillRect(-5,0,3,r*1.3);cx.fillRect(2,0,3,r*1.3)}else cx.fillRect(-2,0,4,r*1.3);cx.restore()}
 cx.restore();if(e.hp<e.mhp){cx.fillStyle='#0008';cx.fillRect(e.x-r,e.y-r-8*S,r*2,3*S);cx.fillStyle='#f55';cx.fillRect(e.x-r,e.y-r-8*S,r*2*Math.max(0,e.hp/e.mhp),3*S)}}
function drawItem(i){const k=i.k;cx.save();cx.translate(i.x,i.y+Math.sin(i.t*5)*3);cx.scale(S*1.15,S*1.15);cx.shadowColor={c:'#fc3',h:'#fff',s:'#4cf',w:'#fa3',m:'#f66',b:'#f55'}[k];cx.shadowBlur=10;
 if(k=='c'){cx.fillStyle='#fc3';cx.beginPath();cx.arc(0,0,9,0,7);cx.fill();cx.shadowBlur=0;cx.strokeStyle='#a70';cx.lineWidth=1.5;cx.beginPath();cx.arc(0,0,6.5,0,7);cx.stroke();cx.fillStyle='#a70';cx.font='bold 10px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('$',0,.5)}
 else if(k=='h'){cx.fillStyle='#fff';cx.fillRect(-9,-7,18,14);cx.shadowBlur=0;cx.fillStyle='#e22';cx.fillRect(-2.5,-6,5,12);cx.fillRect(-7,-2.5,14,5)}
 else if(k=='s'){cx.fillStyle='#2ac';cx.beginPath();cx.moveTo(0,-10);cx.lineTo(9,-6);cx.quadraticCurveTo(9,6,0,11);cx.quadraticCurveTo(-9,6,-9,-6);cx.closePath();cx.fill();cx.shadowBlur=0;cx.fillStyle='#bff';cx.fillRect(-1.5,-6,3,12)}
 else if(k=='w'){cx.fillStyle='#fb4';for(const d of[-6,0,6]){cx.beginPath();cx.moveTo(d,-10);cx.quadraticCurveTo(d+3,-6,d+3,-3);cx.lineTo(d+3,8);cx.lineTo(d-3,8);cx.lineTo(d-3,-3);cx.quadraticCurveTo(d-3,-6,d,-10);cx.fill()}cx.shadowBlur=0;cx.fillStyle='#a52';cx.fillRect(-9,5,18,3)}
 else if(k=='m'){cx.rotate(-.5);cx.fillStyle='#ddd';cx.fillRect(-3,-8,6,16);cx.fillStyle='#e33';cx.beginPath();cx.moveTo(-3,-8);cx.lineTo(0,-14);cx.lineTo(3,-8);cx.fill();cx.fillStyle='#888';cx.beginPath();cx.moveTo(-3,4);cx.lineTo(-8,10);cx.lineTo(-3,9);cx.moveTo(3,4);cx.lineTo(8,10);cx.lineTo(3,9);cx.fill()}
 else{cx.fillStyle='#222';cx.beginPath();cx.arc(0,2,8,0,7);cx.fill();cx.shadowBlur=0;cx.fillStyle='#f55';cx.fillRect(-2,-8,4,3);cx.strokeStyle='#fc3';cx.beginPath();cx.moveTo(0,-8);cx.quadraticCurveTo(4,-12,7,-9);cx.stroke()}
 cx.restore()}
function drawEnemy(e){if(e.g)return drawGround(e);const fl=e.fl>0;const col=fl?['#fff','#fff']:ET[e.type]?.col||['#556','#223'];
 const f=sh=>{cx.save();cx.translate(e.x,e.y);cx.rotate(Math.PI);
  if(e.type=='heli'){cx.rotate(0);drawHeli(cx,sh?['#000','#000']:col,e.t*40,S*1.5)}
  else if(e.type=='drone'){cx.scale(S*1.35,S*1.35);cx.fillStyle=sh?'#000':col[0];cx.beginPath();cx.moveTo(0,-14);cx.lineTo(14,6);cx.lineTo(0,2);cx.lineTo(-14,6);cx.closePath();cx.fill();if(!sh){cx.fillStyle='#f44';cx.fillRect(-2,-2,4,4)}}
  else{const sz={fighter:{l:28,w:28,sw:.25,e:[-3,3]},inter:{l:30,w:22,sw:.38,e:[0]},bomber:{l:40,w:60,sw:.1,e:[-22,-8,8,22]},boss:{l:60,w:92,sw:.12,e:[-40,-20,0,20,40]}}[e.type];
   cx.scale(S*(e.boss?1.5:1.35),S*(e.boss?1.5:1.35));drawJet(cx,{sh:sz},sh?['#000','#000']:col,!sh);
   if(e.boss&&!sh){cx.fillStyle='#e33';for(const d of[-1,1])for(const yy of[-10,12]){cx.beginPath();cx.arc(d*34,yy,5,0,7);cx.fill()}}}
  cx.restore()};
 if(e.y>-50){shadow(e.x,e.y,f);f(false);
 if(e.hp<e.mhp&&!e.boss){cx.fillStyle='#0008';cx.fillRect(e.x-e.r,e.y-e.r-8*S,e.r*2,3*S);cx.fillStyle='#f55';cx.fillRect(e.x-e.r,e.y-e.r-8*S,e.r*2*Math.max(0,e.hp/e.mhp),3*S)}}}

/* ===== HUD / UI ===== */
function hud(){$('sc').textContent=sc;$('cmb').textContent=combo>1.99?'x'+Math.floor(combo):'';$('hp').style.width=Math.max(0,P.hp/P.mhp*100)+'%';$('shb').style.width=P.sh>0?Math.min(100,P.sh/8*100)+'%':'0'}
function refreshUI(){$('mBest').textContent=save.best;$('mCoin').textContent=save.coins;if(P&&state!=='menu'){$('nM').textContent=P.mis;$('nB').textContent=P.bmb;$('lv').textContent=t('level')+' '+lvl;$('co').textContent='🪙 '+coinsRun}}
let hgOn=false,hi=0;
function openHangar(){hi=save.sel;show('pHangar');drawHG()}
function hg(d){hi=(hi+d+JETS.length)%JETS.length;drawHG()}
const UPC=[800,1600,2800,4400,6500];
function drawHG(){const j=JETS[hi],own=save.own.includes(hi),u=save.up[hi]||0,k=1+u*.12;$('hName').textContent=j.n+(u?' ★'+u:'');$('hAb').textContent=j.a?t(j.a):'';$('hCoin').textContent=save.coins;
 const st=[['hp',j.hp*k/260],['spd',j.spd/1.3],['arm',j.hp*k/260],['pow',j.pow*(1+u*.1)/2.6]];$('hSt').innerHTML=st.map(q=>`<span>${t(q[0])}</span><div class="bar"><i style="width:${Math.min(100,q[1]*100)}%"></i></div>`).join('');
 const b=$('hBtn');b.textContent=own?(save.sel==hi?'✔ '+t('select'):t('select')):`🪙 ${j.cost} — ${t('buy')}`;b.disabled=!own&&save.coins<j.cost;
 const ub=$('hUp');ub.style.display=own?'':'none';ub.textContent=u>=5?t('max'):`▲ ${t('upg')} 🪙 ${UPC[u]}`;ub.disabled=u>=5||save.coins<UPC[u];
 const pc=$('pv'),g=pc.getContext('2d');pc.width=220;pc.height=180;g.translate(110,95);g.scale(2.1,2.1);if(j.heli)drawHeli(g,j.col,performance.now()/20,1);else drawJet(g,j,j.col,true,0)}
function hUpg(){const u=save.up[hi]||0;if(u>=5||save.coins<UPC[u])return;save.coins-=UPC[u];save.up[hi]=u+1;persist();drawHG();refreshUI()}
const MI=['🌊','🏜️','🏔️','🌙','🌋','❄️'];
function openLevels(){let h='';for(let i=0;i<LVLS;i++){const o=i==0||save.stars[i-1]>0,s=save.stars[i]||0;h+=`<button class="lv" ${o?`onclick="startGame(${i+1})"`:'disabled'}>${MI[i%6]}<b>${i+1}</b><small>${o?'★'.repeat(s)+'☆'.repeat(3-s):'🔒'}</small>${(i+1)%4==0?'<i>BOSS</i>':''}</button>`}$('lGrid').innerHTML=h;$('lCoin').textContent=save.coins;show('pLv')}
const WN={gun:'🔫 Vulcan',spread:'🔱 Spread',plasma:'⚡ Plasma',cannon:'💥 Cannon'};
function openLoad(){let h='';for(let q=0;q<3;q++)h+=`<div class="row" style="margin:6px"><span>#${q+1}</span><select onchange="save.load[${q}]=this.value||null;persist()"><option value="">— ${t('none')} —</option>${Object.keys(WN).map(k=>`<option value="${k}"${save.load[q]==k?' selected':''}>${WN[k]}</option>`).join('')}</select></div>`;$('ldBox').innerHTML=h;show('pLoad')}
function hAct(){const j=JETS[hi];if(!save.own.includes(hi)){if(save.coins<j.cost)return;save.coins-=j.cost;save.own.push(hi)}save.sel=hi;persist();drawHG();refreshUI()}
setInterval(()=>{if(hgOn)drawHG()},60);

/* ===== Input ===== */
const keys=new Set();let dragId=null,lx=0,ly=0;
addEventListener('keydown',e=>{keys.add(e.key.length==1?e.key.toLowerCase():e.key);if(e.key===' '||e.key==='z')fireMissile();if(e.key==='x'||e.key==='b')bomb();if(e.key==='p'||e.key==='Escape')state==='play'?pause():state==='pause'&&resume();if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys.delete(e.key.length==1?e.key.toLowerCase():e.key));
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;dragId=e.pointerId;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==dragId||state!=='play')return;P.tx+=(e.clientX-lx)*1.35;P.ty+=(e.clientY-ly)*1.35;lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',e=>{if(e.pointerId===dragId)dragId=null});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.androidBack=()=>{state==='play'?pause():state==='pause'?resume():toMenu()};
addEventListener('resize',()=>{rs();mkClouds()});

/* ===== Boot ===== */
function loop(n){const dt=Math.min(.033,(n-last)/1000||.016);last=n;if(state==='play'||state==='over')update(dt);render(state==='pause'?0:dt);requestAnimationFrame(loop)}
$('selL').innerHTML=Object.keys(LN).map(k=>`<option value="${k}">${LN[k]}</option>`).join('');$('selL').value=save.lang;
rs();mkClouds();setLang(save.lang);refreshUI();requestAnimationFrame(loop);
</script>
